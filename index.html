// ── Seeded RNG (matches C++ srand(42) / rand()) ───────────────────────────────

function srand(s){_seed=(s*1664525+1013904223)&0x7fffffff;}
function rand(){_seed=(_seed*1664525+1013904223)&0x7fffffff;return _seed;}
function randN(n){return((rand()%n)+n)%n;}  // always positive

const cell=(x,y)=>{const mx=x|0,my=y|0;if(mx<0||mx>=MW||my<0||my>=MH)return 1;return MAP[my*MW+mx];};

// ── Texture data (Uint32 ARGB, matches C++) ────────────────────────────────────
const T_WALL=Array.from({length:4},()=>new Uint32Array(TEX*TEX));
const T_ENEMY=new Uint32Array(TEX*TEX);
const T_ALLY=new Uint32Array(TEX*TEX);

function argb(r,g,b){
  r=r<0?0:r>255?255:r; g=g<0?0:g>255?255:g; b=b<0?0:b>255?255:b;
  return (0xFF000000|((r&0xFF)<<16)|((g&0xFF)<<8)|(b&0xFF))>>>0;
}
function dimC(c,d){
  let f=1/(1+d*d*0.09); if(f>1)f=1;
  return argb(((c>>16)&0xFF)*f|0,((c>>8)&0xFF)*f|0,(c&0xFF)*f|0);
}

function buildRobotSprite(S,hr,hg,hb,br,bg,bb){
  S.fill(0);
  const set=(x,y,r,g,b)=>{if(x>=0&&x<TEX&&y>=0&&y<TEX)S[y*TEX+x]=argb(r,g,b);};
  // Body
  for(let y=32;y<58;y++)for(let x=20;x<44;x++)S[y*TEX+x]=argb(br,bg,bb);
  // Arms
  for(let y=34;y<52;y++){
    for(let x=14;x<20;x++)S[y*TEX+x]=argb(br-20,bg-20,bb-20);
    for(let x=44;x<50;x++)S[y*TEX+x]=argb(br-20,bg-20,bb-20);
  }
  // Neck
  for(let y=28;y<33;y++)for(let x=27;x<37;x++)S[y*TEX+x]=argb(br-30,bg-30,bb-30);
  // Head
  for(let y=6;y<30;y++)for(let x=14;x<50;x++){
    const dx=x-32,dy=y-18;
    if(dx*dx+dy*dy<225)S[y*TEX+x]=argb(hr,hg,hb);
  }
  // Eyes
  for(let y=12;y<21;y++)for(let x=20;x<27;x++){const dx=x-23,dy=y-16;if(dx*dx+dy*dy<14)S[y*TEX+x]=argb(255,255,255);}
  for(let y=12;y<21;y++)for(let x=37;x<44;x++){const dx=x-40,dy=y-16;if(dx*dx+dy*dy<14)S[y*TEX+x]=argb(255,255,255);}
  for(let y=14;y<18;y++){for(let x=22;x<25;x++)S[y*TEX+x]=argb(20,20,40);for(let x=39;x<42;x++)S[y*TEX+x]=argb(20,20,40);}
  // Smile
  for(let x=24;x<40;x++)S[25*TEX+x]=argb(60,20,10);
  S[24*TEX+23]=S[24*TEX+40]=argb(60,20,10);
  // Antenna
  for(let y=0;y<7;y++)S[y*TEX+32]=argb(255,80,180);
  for(let y=0;y<4;y++)for(let x=30;x<35;x++)S[y*TEX+x]=argb(255,50,140);
  // Legs
  for(let y=58;y<64;y++){
    for(let x=22;x<30;x++)S[y*TEX+x]=argb(br-40,bg-40,bb-40);
    for(let x=34;x<42;x++)S[y*TEX+x]=argb(br-40,bg-40,bb-40);
  }
}

function genTextures(){
  srand(42);
  const wr=[160,80,55,180],wg=[75,140,60,50],wb=[40,200,175,40];
  for(let t=0;t<4;t++)for(let y=0;y<TEX;y++)for(let x=0;x<TEX;x++){
    const bx=x+((y/8|0)%2)*(TEX/2);
    const mortar=(y%8===0)||((bx%TEX===0)&&y%8!==0);
    const n=(randN(21))-10;
    T_WALL[t][y*TEX+x]=mortar?argb(88+n,82+n,78+n):argb(wr[t]+n,wg[t]+n,wb[t]+n);
  }
  buildRobotSprite(T_ENEMY,255,140,30,  220,160,40);
  buildRobotSprite(T_ALLY,  80,230,230,  50,160,220);
}

// ── Audio (Web Audio, matches C++ synthesis) ───────────────────────────────────
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playBuf(buf,vol=1,ch=0){
  if(!audioCtx)return;
  const src=audioCtx.createBufferSource();
  const g=audioCtx.createGain();g.gain.value=vol;
  src.buffer=buf;src.connect(g);g.connect(audioCtx.destination);src.start();
}
function makeBuf(seconds,fn){
  if(!audioCtx)return null;
  const sr=audioCtx.sampleRate;
  const n=Math.ceil(sr*seconds);
  const buf=audioCtx.createBuffer(1,n,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=fn(i/n,i,sr);
  return buf;
}
let sndShoot=null,sndHit=null,sndHurt=null,sndStep=null;
function genAudio(){
  if(!audioCtx)return;
  sndShoot=makeBuf(0.1,(t)=>{const f=1200-t*900;const e=(1-t)*(1-t);return Math.sin(2*Math.PI*f*t)*e*0.5;});
  sndHit=makeBuf(0.2,(t)=>{const f=700+Math.sin(t*Math.PI)*500;const e=t<0.1?t/0.1:(1-t);return Math.sin(2*Math.PI*f*t)*e*0.35;});
  sndHurt=makeBuf(0.125,(t)=>{const f=200+t*100;return Math.sin(2*Math.PI*f*t)*(1-t)*0.4;});
  sndStep=makeBuf(0.06,(t)=>{return (Math.random()*2-1)*(1-t)*(1-t)*0.15;});
}

// ── Game state ─────────────────────────────────────────────────────────────────
const MENU=0,PLAYING=1,WIN=2,LOSE=3,SOLO=0,TEAM=1;
let gState=MENU,gMode=SOLO,gTime=0,gKills=0;

let player={x:2.5,y:2.5,angle:0,pitch:0,hp:100,shootCD:0,bobTime:0,bobOffset:0,moveSpeed:0.055};
let enemies=[],allies=[],bullets=[];
const zBuf=new Float32Array(W);

const ENEMY_SPAWNS=[
  {x:5.5,y:5.5},{x:22.5,y:2.5},{x:24.5,y:10.5},
  {x:15.5,y:10.5},{x:6.5,y:20.5},{x:22.5,y:18.5},
  {x:11.5,y:22.5},{x:18.5,y:24.5},{x:4.5,y:15.5},{x:25.5,y:24.5}
];

function resetGame(m){
  gMode=m;gState=PLAYING;gTime=0;gKills=0;
  player={x:2.5,y:2.5,angle:0,pitch:0,hp:100,shootCD:0,bobTime:0,bobOffset:0,moveSpeed:0.055};
  enemies=ENEMY_SPAWNS.map(s=>({x:s.x,y:s.y,alive:true,chasing:false,
    patrolAngle:Math.random()*Math.PI*2,patrolTimer:0,
    shootTimer:2+Math.random(),stepTimer:0,bobTime:0}));
  bullets=[];
  allies=[];
  if(m===TEAM){
    allies.push({x:3.5,y:2.5,alive:true,angle:0,shootTimer:1,patrolTimer:0,patrolAngle:0,bobTime:0});
    allies.push({x:2.5,y:4.5,alive:true,angle:0,shootTimer:1,patrolTimer:0,patrolAngle:0,bobTime:0});
    allies.push({x:4.5,y:3.5,alive:true,angle:0,shootTimer:1,patrolTimer:0,patrolAngle:0,bobTime:0});
    allies.push({x:3.5,y:5.5,alive:true,angle:0,shootTimer:1,patrolTimer:0,patrolAngle:0,bobTime:0});
  }
}

// ── DDA raycast ────────────────────────────────────────────────────────────────
function castRay(px,py,rdx,rdy){
  let mx=px|0,my=py|0;
  const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
  let sdx,sdy,sx,sy,tile=1,side=0;
  if(rdx<0){sx=-1;sdx=(px-mx)*ddx;}else{sx=1;sdx=(mx+1-px)*ddx;}
  if(rdy<0){sy=-1;sdy=(py-my)*ddy;}else{sy=1;sdy=(my+1-py)*ddy;}
  while(true){
    if(sdx<sdy){sdx+=ddx;mx+=sx;side=0;}else{sdy+=ddy;my+=sy;side=1;}
    if(mx<0||mx>=MW||my<0||my>=MH){return{dist:64,tile:1,side:0};}
    if(MAP[my*MW+mx]){tile=MAP[my*MW+mx];break;}
  }
  return{dist:side===0?(sdx-ddx):(sdy-ddy),tile,side};
}

function rayHitsWall(x,y,dx,dy,dist){
  for(let d=0;d<dist;d+=0.1){
    const tx=x+dx*d,ty=y+dy*d;
    const mx=tx|0,my=ty|0;
    if(mx<0||mx>=MW||my<0||my>=MH||MAP[my*MW+mx])return true;
  }
  return false;
}

// ── Bullets ────────────────────────────────────────────────────────────────────
function fireBullet(x,y,angle,friendly){
  bullets.push({x,y,dx:Math.cos(angle)*0.22,dy:Math.sin(angle)*0.22,life:12,friendly,active:true});
}
function playerShoot(){
  if(player.shootCD>0)return;
  fireBullet(player.x,player.y,player.angle,true);
  if(sndShoot)playBuf(sndShoot,0.8);
  player.shootCD=0.18;
  // Hitscan
  const spread=(Math.random()-0.5)*0.05;
  const sa=player.angle+spread;
  let hit=null,minDist=Infinity;
  for(const en of enemies){
    if(!en.alive)continue;
    const dx=en.x-player.x,dy=en.y-player.y;
    const dist=Math.hypot(dx,dy);
    const angle=Math.atan2(dy,dx);
    let diff=Math.abs(angle-sa);
    while(diff>Math.PI)diff=Math.abs(diff-Math.PI*2);
    if(diff<0.18&&dist<minDist&&!rayHitsWall(player.x,player.y,dx/dist,dy/dist,dist)){
      hit=en;minDist=dist;
    }
  }
  if(hit){
    hit.alive=false;gKills++;
    if(sndHit)playBuf(sndHit,0.6);
  }
}

function updateBullets(dt){
  for(const b of bullets){
    if(!b.active)continue;
    b.x+=b.dx;b.y+=b.dy;b.life-=0.22;
    if(b.life<=0){b.active=false;continue;}
    const mx=b.x|0,my=b.y|0;
    if(mx<0||mx>=MW||my<0||my>=MH||MAP[my*MW+mx]){b.active=false;continue;}
    if(b.friendly){
      for(const e of enemies){
        if(!e.alive)continue;
        if((e.x-b.x)**2+(e.y-b.y)**2<0.3){e.alive=false;b.active=false;gKills++;if(sndHit)playBuf(sndHit,0.6);break;}
      }
    } else {
      const dx=player.x-b.x,dy=player.y-b.y;
      if(dx*dx+dy*dy<0.3){player.hp-=10;b.active=false;if(sndHurt)playBuf(sndHurt,0.5);}
      for(const a of allies){
        if(!a.alive)continue;
        if((a.x-b.x)**2+(a.y-b.y)**2<0.3){a.alive=false;b.active=false;break;}
      }
    }
  }
  bullets=bullets.filter(b=>b.active);
}

// ── AI ─────────────────────────────────────────────────────────────────────────
function moveAgent(a,dx,dy,spd){
  const nx=a.x+dx*spd,ny=a.y+dy*spd,M=0.25;
  if(MAP[(ny|0)*MW+(a.x|0)]===0&&MAP[((ny+M)|0)*MW+(a.x|0)]===0&&MAP[((ny-M)|0)*MW+(a.x|0)]===0)a.y=ny;
  if(MAP[(a.y|0)*MW+(nx|0)]===0&&MAP[((a.y+M)|0)*MW+(nx|0)]===0&&MAP[((a.y-M)|0)*MW+(nx|0)]===0)a.x=nx;
}

function updateEnemies(dt){
  for(const e of enemies){
    if(!e.alive)continue;
    e.bobTime+=dt*6;
    const dx=player.x-e.x,dy=player.y-e.y;
    const dist=Math.hypot(dx,dy);
    // Find nearest ally to also target
    let bestAlly=null,bestAD=999;
    for(const a of allies){
      if(!a.alive)continue;
      const d=Math.hypot(a.x-e.x,a.y-e.y);
      if(d<bestAD){bestAD=d;bestAlly=a;}
    }
    const chasePlayer=dist<12;
    const chaseAlly=bestAlly&&bestAD<12&&bestAD<dist;
    if(chasePlayer||chaseAlly){
      e.chasing=true;
      let tdx,tdy,td;
      if(chaseAlly&&!chasePlayer){tdx=bestAlly.x-e.x;tdy=bestAlly.y-e.y;td=bestAD;}
      else{tdx=dx;tdy=dy;td=dist;}
      moveAgent(e,tdx/td,tdy/td,0.026);
      e.shootTimer-=dt;
      if(e.shootTimer<=0&&td<10){
        const spread=(Math.random()-0.5)*0.06;
        fireBullet(e.x,e.y,Math.atan2(tdy,tdx)+spread,false);
        e.shootTimer=1.1+Math.random()*0.8;
      }
    } else {
      e.chasing=false;e.patrolTimer-=dt;
      if(e.patrolTimer<=0){e.patrolAngle=Math.random()*Math.PI*2;e.patrolTimer=0.8+Math.random()*1.2;}
      moveAgent(e,Math.cos(e.patrolAngle),Math.sin(e.patrolAngle),0.014);
    }
    e.stepTimer-=dt;
    if(e.stepTimer<=0&&sndStep&&dist<14){
      playBuf(sndStep,Math.max(0.05,(1-dist/14)*0.3));
      e.stepTimer=0.4;
    }
  }
}

function updateAllies(dt){
  for(const a of allies){
    if(!a.alive)continue;
    a.bobTime+=dt*5;
    let best=null,bestD=999;
    for(const e of enemies){
      if(!e.alive)continue;
      const d=Math.hypot(e.x-a.x,e.y-a.y);
      if(d<bestD){bestD=d;best=e;}
    }
    if(best){
      const dx=best.x-a.x,dy=best.y-a.y;
      a.angle=Math.atan2(dy,dx);
      if(bestD>2.2)moveAgent(a,dx/bestD,dy/bestD,0.022);
      a.shootTimer-=dt;
      if(a.shootTimer<=0&&bestD<14){
        fireBullet(a.x,a.y,a.angle+(Math.random()-0.5)*0.04,true);
        a.shootTimer=0.5+Math.random()*0.6;
      }
    }
  }
}

// ── 3D render (direct pixel write) ────────────────────────────────────────────
function renderFrame(){
  const hor=((H/2+player.pitch)|0);
  const dirX=Math.cos(player.angle),dirY=Math.sin(player.angle);
  const plnX=-dirY*CAM,plnY=dirX*CAM;

  // Floor / ceiling
  for(let y=0;y<H;y++){
    const i=y*W*4;
    if(y>=hor){
      const t=(y-hor)/(H-hor+1);const sh=30+(t*55)|0;
      for(let x=0;x<W;x++){const j=i+x*4;px[j]=sh;px[j+1]=sh-2;px[j+2]=sh-5;px[j+3]=255;}
    } else {
      const t=(hor-y)/(hor+1);const sh=10+(t*22)|0;
      for(let x=0;x<W;x++){const j=i+x*4;px[j]=sh;px[j+1]=sh+4;px[j+2]=sh+14;px[j+3]=255;}
    }
  }

  // Walls
  for(let x=0;x<W;x++){
    const cam=2*x/W-1;
    const rdx=dirX+plnX*cam,rdy=dirY+plnY*cam;
    const {dist,tile,side}=castRay(player.x,player.y,rdx,rdy);
    zBuf[x]=dist;
    const lh=(H/dist)|0;
    const ds=hor-(lh/2)|0, de=hor+(lh/2)|0;
    let wallX=(side===0)?player.y+dist*rdy:player.x+dist*rdx;
    wallX-=Math.floor(wallX);
    let tx=(wallX*TEX)|0;
    if((side===0&&rdx>0)||(side===1&&rdy<0))tx=TEX-tx-1;
    if(tx<0)tx=0;if(tx>=TEX)tx=TEX-1;
    const wall=T_WALL[(tile-1)%4];
    const y0=ds<0?0:ds, y1=de>=H?H-1:de;
    for(let y=y0;y<=y1;y++){
      const tty=((y-ds)*TEX/lh)|0;
      const c=wall[(tty<0?0:tty>=TEX?TEX-1:tty)*TEX+tx];
      const dc=dimC(c,side===1?dist+1.2:dist);
      const j=(y*W+x)*4;
      px[j]=(dc>>16)&0xFF;px[j+1]=(dc>>8)&0xFF;px[j+2]=dc&0xFF;px[j+3]=255;
    }
  }

  // Sprites: enemies, allies, bullets — sorted back to front
  const sprList=[];
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];if(!e.alive)continue;
    sprList.push({dist:(e.x-player.x)**2+(e.y-player.y)**2,type:0,idx:i});
  }
  for(let i=0;i<allies.length;i++){
    const a=allies[i];if(!a.alive)continue;
    sprList.push({dist:(a.x-player.x)**2+(a.y-player.y)**2,type:1,idx:i});
  }
  for(let i=0;i<bullets.length;i++){
    const b=bullets[i];if(!b.active)continue;
    sprList.push({dist:(b.x-player.x)**2+(b.y-player.y)**2,type:2,idx:i});
  }
  sprList.sort((a,b)=>b.dist-a.dist);

  const inv=1/(plnX*dirY-dirX*plnY);
  for(const s of sprList){
    let sx,sy,texW,texH,texData,bobShift=0;
    if(s.type===0){const e=enemies[s.idx];sx=e.x-player.x;sy=e.y-player.y;texData=T_ENEMY;texW=texH=TEX;bobShift=Math.sin(e.bobTime)*3|0;}
    else if(s.type===1){const a=allies[s.idx];sx=a.x-player.x;sy=a.y-player.y;texData=T_ALLY;texW=texH=TEX;bobShift=Math.sin(a.bobTime)*3|0;}
    else{const b=bullets[s.idx];sx=b.x-player.x;sy=b.y-player.y;texData=b.friendly?null:null;texW=texH=4;}

    const tX=inv*(dirY*sx-dirX*sy);
    const tY=inv*(-plnY*sx+plnX*sy);
    if(tY<=0.05)continue;
    const scrX=((W/2)*(1+tX/tY))|0;
    const sprH=Math.abs((H/tY)|0);
    const sprW=texW===TEX?sprH:(H/tY/8)|0;
    const dys=(hor-sprH/2+bobShift)|0, dye=(hor+sprH/2+bobShift)|0;
    const dxs=(scrX-sprW/2)|0, dxe=(scrX+sprW/2)|0;

    for(let cx=dxs;cx<dxe;cx++){
      if(cx<0||cx>=W||tY>=zBuf[cx])continue;
      const ttx=((cx-dxs)*texW/sprW)|0;
      for(let cy=dys;cy<dye;cy++){
        if(cy<0||cy>=H)continue;
        const tty=((cy-dys)*texH/sprH)|0;
        let col;
        if(s.type===2){// bullet dot
          col=s.type===2&&bullets[s.idx].friendly?argb(255,240,80):argb(255,60,60);
        } else {
          col=texData[tty*texW+ttx];
        }
        if((col&0x00FFFFFF)===0)continue;
        let fc;
        if(s.type===2){fc=col;}
        else{fc=dimC(col,tY);}
        const j=(cy*W+cx)*4;
        px[j]=(fc>>16)&0xFF;px[j+1]=(fc>>8)&0xFF;px[j+2]=fc&0xFF;px[j+3]=255;
      }
    }
  }

  // Gun
  const gx=W/2|0, gy=((H-40+player.bobOffset)|0);
  const setP=(x,y,r,g,b)=>{if(x>=0&&x<W&&y>=0&&y<H){const j=(y*W+x)*4;px[j]=r;px[j+1]=g;px[j+2]=b;px[j+3]=255;}};
  for(let y=gy-6;y<gy+6;y++)for(let x=gx-3;x<gx+22;x++)setP(x,y,80,80,80);
  for(let y=gy-3;y<gy+20;y++)for(let x=gx-14;x<gx+12;x++)setP(x,y,90,70,55);
  for(let x=gx-13;x<gx+11;x++)setP(x,gy-3,130,100,80);
}

// ── HUD (canvas 2D on top) ────────────────────────────────────────────────────
function renderHUD(){
  cx.save();
  // Scanlines
  cx.globalAlpha=0.12;cx.fillStyle='#000';
  for(let y=0;y<H;y+=2)cx.fillRect(0,y,W,1);
  cx.globalAlpha=1;
  // HP bar
  const bw=120,bh=12,bx=10,by=H-26,hp=Math.max(0,player.hp);
  cx.fillStyle='rgba(20,20,20,0.8)';cx.fillRect(bx,by,bw,bh);
  cx.fillStyle=hp>60?'#00c800':hp>30?'#ff8c00':'#ff2020';
  cx.fillRect(bx,by,bw*hp/100,bh);
  cx.strokeStyle='rgba(100,100,100,0.8)';cx.lineWidth=1;cx.strokeRect(bx,by,bw,bh);
  cx.fillStyle='rgba(200,200,200,0.8)';cx.font='bold 9px monospace';cx.fillText('HP',bx+bw+6,by+9);
  // Kill counter
  cx.fillStyle='rgba(0,230,180,1)';cx.font='bold 14px monospace';
  cx.textAlign='right';cx.fillText(gKills+'/'+enemies.length,W-10,22);
  cx.fillStyle='rgba(100,180,140,0.8)';cx.font='9px monospace';cx.fillText('KILLS',W-12,34);
  cx.textAlign='left';
  // Mode tag
  cx.fillStyle='rgba(0,180,255,0.8)';cx.font='9px monospace';
  cx.fillText(gMode===TEAM?'TEAM':'SOLO',8,20);
  if(gMode===TEAM){
    const alive=allies.filter(a=>a.alive).length;
    cx.fillStyle='rgba(80,220,255,0.8)';cx.fillText('ALLIES: '+alive,8,32);
  }
  // Crosshair
  cx.strokeStyle='rgba(255,255,255,0.7)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(W/2-8,H/2);cx.lineTo(W/2+8,H/2);
  cx.moveTo(W/2,H/2-8);cx.lineTo(W/2,H/2+8);cx.stroke();
  // Minimap
  const S=5,OX=W-MW*S-8,OY=48;
  cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(OX-2,OY-2,MW*S+4,MH*S+4);
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
    cx.fillStyle=MAP[r*MW+c]?'rgba(140,130,120,0.8)':'rgba(25,25,25,0.6)';
    cx.fillRect(OX+c*S,OY+r*S,S-1,S-1);
  }
  for(const e of enemies)if(e.alive){cx.fillStyle='rgba(255,80,80,0.9)';cx.fillRect(OX+e.x*S-1,OY+e.y*S-1,3,3);}
  for(const a of allies)if(a.alive){cx.fillStyle='rgba(80,220,255,0.9)';cx.fillRect(OX+a.x*S-1,OY+a.y*S-1,3,3);}
  cx.fillStyle='#fff';cx.fillRect(OX+player.x*S-2,OY+player.y*S-2,4,4);
  cx.strokeStyle='#ffdd00';cx.lineWidth=1.5;
  cx.beginPath();cx.moveTo(OX+player.x*S,OY+player.y*S);
  cx.lineTo(OX+player.x*S+Math.cos(player.angle)*10,OY+player.y*S+Math.sin(player.angle)*10);cx.stroke();
  // Hurt flash
  if(hp<30){const a=0.08+0.06*Math.sin(gTime*8);cx.fillStyle=`rgba(200,0,0,${a})`;cx.fillRect(0,0,W,H);}
  cx.restore();
}

// ── Menu ───────────────────────────────────────────────────────────────────────
function renderMenu(t){
  cx.fillStyle='#05050f';cx.fillRect(0,0,W,H);
  // Animated grid
  for(let y=0;y<H;y+=18){
    const a=0.06+0.04*Math.sin(y*0.08+t*1.5);
    cx.strokeStyle=`rgba(0,180,255,${a})`;cx.lineWidth=1;
    cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();
  }
  for(let x=0;x<W;x+=18){
    const a=0.06+0.04*Math.sin(x*0.08-t*1.5);
    cx.strokeStyle=`rgba(0,180,255,${a})`;cx.lineWidth=1;
    cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();
  }
  // Title glow
  const pulse=0.12+0.08*Math.sin(t*2);
  cx.fillStyle=`rgba(0,200,255,${pulse})`;cx.fillRect(W/2-160,35,320,55);
  cx.textAlign='center';
  cx.fillStyle='#00f0ff';cx.font='bold 32px monospace';cx.fillText('RAYCASTER',W/2,72);
  cx.fillStyle='rgba(100,200,200,0.85)';cx.font='12px monospace';cx.fillText('C++ EDITION',W/2,90);
  // Divider
  cx.strokeStyle='rgba(0,200,255,0.7)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(W/2-120,108);cx.lineTo(W/2+120,108);cx.stroke();
  // Solo button
  const sc=0.7+0.2*Math.sin(t*3);
  cx.fillStyle=`rgba(0,40,55,0.83)`;cx.fillRect(0,114,W,80);
  cx.strokeStyle=`rgba(0,${(sc*255)|0},${(sc*255)|0},0.9)`;cx.lineWidth=2;cx.strokeRect(4,116,W-8,76);
  cx.fillStyle=`rgba(0,${(sc*200)|0},${(sc*200)|0},1)`;cx.font='bold 14px monospace';
  cx.fillText('[ 1 ]  SOLO MODE  — Click here',W/2,142);
  cx.fillStyle='rgba(100,200,200,0.8)';cx.font='11px monospace';cx.fillText('You vs all 10 enemies',W/2,162);
  // Team button
  const tc=0.7+0.2*Math.sin(t*3+1);
  cx.fillStyle='rgba(40,0,55,0.83)';cx.fillRect(0,204,W,80);
  cx.strokeStyle=`rgba(${(tc*255)|0},0,${(tc*255)|0},0.9)`;cx.lineWidth=2;cx.strokeRect(4,206,W-8,76);
  cx.fillStyle=`rgba(${(tc*200)|0},80,${(tc*200)|0},1)`;cx.font='bold 14px monospace';
  cx.fillText('[ 2 ]  TEAM MODE  — Click here',W/2,232);
  cx.fillStyle='rgba(180,100,200,0.8)';cx.font='11px monospace';cx.fillText('You + 4 allies vs 10 enemies',W/2,252);
  // Controls
  cx.fillStyle='rgba(80,120,120,0.85)';cx.font='9px monospace';
  cx.fillText('WASD move  ·  Mouse X/Y look  ·  LMB shoot  ·  ESC back',W/2,318);
  // Scanlines
  cx.fillStyle='rgba(0,0,0,0.08)';
  for(let y=0;y<H;y+=2)cx.fillRect(0,y,W,1);
  cx.textAlign='left';
}

// ── End screen ─────────────────────────────────────────────────────────────────
function renderEnd(won,t){
  cx.fillStyle='rgba(0,0,0,0.8)';cx.fillRect(0,0,W,H);
  const pw=340,ph=200,px2=W/2-pw/2,py=H/2-ph/2;
  cx.fillStyle=won?'rgba(0,40,0,0.9)':'rgba(40,0,0,0.9)';cx.fillRect(px2,py,pw,ph);
  const pulse=0.12+0.08*Math.sin(t*3);
  cx.fillStyle=won?`rgba(0,80,0,${pulse})`:`rgba(80,0,0,${pulse})`;cx.fillRect(px2,py,pw,ph);
  cx.strokeStyle=won?'#00c800':'#c80000';cx.lineWidth=2;cx.strokeRect(px2,py,pw,ph);
  cx.textAlign='center';
  cx.fillStyle=won?'#00ff78':'#ff3c3c';cx.font='bold 24px monospace';
  cx.fillText(won?'MISSION COMPLETE':'GAME  OVER',W/2,py+44);
  const sc={r:200,g:220,b:220};
  cx.fillStyle=`rgb(${sc.r},${sc.g},${sc.b})`;cx.font='bold 13px monospace';
  cx.fillText('Kills:  '+gKills+'/'+enemies.length,W/2,py+90);
  const secs=gTime|0,mins=(secs/60)|0;
  cx.fillText('Time:   '+mins+':'+(secs%60<10?'0':'')+(secs%60),W/2,py+112);
  cx.fillText('Health: '+Math.max(0,player.hp)+'%',W/2,py+134);
  if((Math.sin(t*4))>0){
    cx.fillStyle='rgba(150,200,200,0.8)';cx.font='10px monospace';
    cx.fillText('Press ENTER to return to menu',W/2,py+168);
  }
  cx.fillStyle='rgba(0,0,0,0.08)';
  for(let y=0;y<H;y+=2)cx.fillRect(0,y,W,1);
  cx.textAlign='left';
}

// ── Input ──────────────────────────────────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();
    if(gState===PLAYING)playerShoot();
    if(gState===WIN||gState===LOSE){gState=MENU;document.exitPointerLock();}
    if(gState===MENU){initAudio();genAudio();resetGame(SOLO);cv.requestPointerLock();}
  }
  if(e.code==='Digit1'&&gState===MENU){initAudio();genAudio();resetGame(SOLO);cv.requestPointerLock();}
  if(e.code==='Digit2'&&gState===MENU){initAudio();genAudio();resetGame(TEAM);cv.requestPointerLock();}
  if(e.code==='Enter'){
    if(gState===WIN||gState===LOSE){gState=MENU;document.exitPointerLock();}
    if(gState===MENU){initAudio();genAudio();resetGame(SOLO);cv.requestPointerLock();}
  }
  if(e.code==='Escape'){
    if(gState===PLAYING){gState=MENU;document.exitPointerLock();}
  }
});
document.addEventListener('keyup',e=>{delete keys[e.code];});

document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===cv&&gState===PLAYING){
    player.angle+=e.movementX*SENS;
    player.pitch-=e.movementY*1.2;
    if(player.pitch>200)player.pitch=200;
    if(player.pitch<-200)player.pitch=-200;
  }
});
cv.addEventListener('mousedown',e=>{
  initAudio();genAudio();
  if(gState===MENU){
    const rect=cv.getBoundingClientRect();
    const ry=(e.clientY-rect.top)/rect.height*H;
    if(ry>114&&ry<194){resetGame(SOLO);cv.requestPointerLock();}
    else if(ry>=204&&ry<284){resetGame(TEAM);cv.requestPointerLock();}
    else cv.requestPointerLock();
  }
  if(gState===PLAYING){
    if(document.pointerLockElement!==cv)cv.requestPointerLock();
    if(e.button===0)playerShoot();
  }
  if(gState===WIN||gState===LOSE){gState=MENU;document.exitPointerLock&&document.exitPointerLock();}
});

// ── Game loop ──────────────────────────────────────────────────────────────────
genTextures();
let lastTime=0,menuTime=0;

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastTime)/1000,0.05);lastTime=now;
  menuTime+=dt;

  if(gState===PLAYING){
    gTime+=dt;
    // Movement
    const spd=player.moveSpeed;
    let moving=false;
    if(keys['KeyW']||keys['ArrowUp'])   {const nx=player.x+Math.cos(player.angle)*spd,ny=player.y+Math.sin(player.angle)*spd;moveAgentXY(player,nx,ny);moving=true;}
    if(keys['KeyS']||keys['ArrowDown']) {const nx=player.x-Math.cos(player.angle)*spd,ny=player.y-Math.sin(player.angle)*spd;moveAgentXY(player,nx,ny);moving=true;}
    if(keys['KeyA'])                    {const nx=player.x+Math.cos(player.angle-Math.PI/2)*spd,ny=player.y+Math.sin(player.angle-Math.PI/2)*spd;moveAgentXY(player,nx,ny);moving=true;}
    if(keys['KeyD'])                    {const nx=player.x+Math.cos(player.angle+Math.PI/2)*spd,ny=player.y+Math.sin(player.angle+Math.PI/2)*spd;moveAgentXY(player,nx,ny);moving=true;}
    if(keys['ArrowLeft']) player.angle-=0.042;
    if(keys['ArrowRight'])player.angle+=0.042;
    if(moving){player.bobTime+=dt*9;player.bobOffset=Math.sin(player.bobTime)*5;}
    else player.bobOffset*=0.85;
    if(player.shootCD>0)player.shootCD-=dt;

    updateEnemies(dt);
    if(gMode===TEAM)updateAllies(dt);
    updateBullets(dt);

    const allDead=enemies.every(e=>!e.alive);
    if(allDead){gState=WIN;document.exitPointerLock&&document.exitPointerLock();}
    if(player.hp<=0){gState=LOSE;document.exitPointerLock&&document.exitPointerLock();}

    renderFrame();
    cx.putImageData(imgData,0,0);
    renderHUD();
  } else if(gState===MENU){
    renderMenu(menuTime);
  } else {
    cx.putImageData(imgData,0,0);
    renderEnd(gState===WIN,gTime);
  }
}

function moveAgentXY(a,nx,ny){
  const M=0.25;
  if(MAP[(ny|0)*MW+(a.x|0)]===0&&MAP[((ny+M)|0)*MW+(a.x|0)]===0&&MAP[((ny-M)|0)*MW+(a.x|0)]===0)a.y=ny;
  if(MAP[(a.y|0)*MW+(nx|0)]===0&&MAP[((a.y+M)|0)*MW+(nx|0)]===0&&MAP[((a.y-M)|0)*MW+(nx|0)]===0)a.x=nx;
}

requestAnimationFrame(loop);
</script>
